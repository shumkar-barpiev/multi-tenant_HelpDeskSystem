spring.application.name=multi-tenant_HelpDeskSystem

# JWT_SECRET must be a Base64-encoded value that decodes to at least 32 bytes.
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=${JWT_ISSUER:multi-tenant-helpdesk}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:30d}
